<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Byzantine Interval Analyzer</title>
    <style>
        body {

            background-color: #f9f9f9;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #recordBtn {
            background-color: #d9534f;
            color: white;
        }
        #recordBtn.recording {
            background-color: #222;
            animation: pulse 1s infinite;
        }
        #playBtn {
            background-color: #5cb85c;
            color: white;
        }
        #playBtn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            font-style: italic;
        }
        canvas {
            width: 100%;
            max-width: 600px;
            height: 200px;
            background-color: #111;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
