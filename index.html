<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byzantine Interval Tuner & Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fcfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #8a6d3b; margin-bottom: 5px; }
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .setup-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 150px;
        }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        select, button {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            border: none; cursor: pointer; font-weight: bold; color: white; transition: background 0.2s;
        }
        #recordBtn { background-color: #a94442; }
        #recordBtn.recording { background-color: #31708f; }
        
        .live-display {
            background: #1a1a1a;
            color: #00ffcc;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        #liveNote { font-size: 36px; font-weight: bold; color: #ffcc00; }
        #liveFreq { font-size: 16px; color: #aaa; margin-top: 5px; }
        #deviationBar {
            height: 10px; background: #333; border-radius: 5px; margin-top: 15px; position: relative; overflow: hidden;
        }
        #deviationPointer {
            width: 6px; height: 10px; background: #ff3333; position: absolute; left: 50%; transform: translateX(-50%); transition: left 0.1s ease;
        }
        
        .analysis-table {
            width: 100%; border-collapse: collapse; margin-top: 15px;
        }
        .analysis-table th, .analysis-table td {
            border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px;
        }
        .analysis-table th { background-color: #f5f0e6; color: #8a6d3b; }
        .status-perfect { color: #3c763d; font-weight: bold; }
        .status-sharp { color: #a94442; font-weight: bold; }
        .status-flat { color: #31708f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Byzantine Interval Analyzer</h2>
    <p style="font-size:13px; color:#666;">Select your base target frequency, click listen, and practice your steps.</p>

    <div class="setup-row">
        <div class="form-group">
            <label for="toneSelect">Scale / Mode</label>
            <select id="toneSelect">
                <option value="diatonic">Tone I (Diatonic: 10-8-12-12-10-8-12)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="basePitch">Base Pitch (ΝΗ / ΠΑ)</label>
            <select id="basePitch">
                <option value="220">ΠΑ @ 220 Hz (Standard Male)</option>
                <option value="440">ΠΑ @ 440 Hz (Standard Female/High)</option>
                <option value="193.3">ΝΗ @ 193.3 Hz (Traditional)</option>
            </select>
        </div>
    </div>

    <button id="recordBtn">🎤 Start Listening & Analyzing</button>

    <div class="live-display" style="margin-top: 20px;">
        <div id="liveNote">--</div>
        <div id="liveFreq">0.0 Hz</div>
        <div id="deviationText">Stabilize voice to detect step</div>
        <div id="deviationBar"><div id="deviationPointer"></div></div>
    </div>

    <h3>Target Byzantine Structural Notes (Moria from Base)</h3>
    <table class="analysis-table">
        <thead>
            <tr>
                <th>Note Name</th>
                <th>Interval (Moria)</th>
                <th>Cumulative Moria</th>
                <th>Target Freq</th>
                <th>Your Accuracy</th>
            </tr>
        </thead>
        <tbody id="analysisBody">
            </tbody>
    </table>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const toneSelect = document.getElementById('toneSelect');
    const basePitchSelect = document.getElementById('basePitch');
    const liveNote = document.getElementById('liveNote');
    const liveFreq = document.getElementById('liveFreq');
    const deviationPointer = document.getElementById('deviationPointer');
    const deviationText = document.getElementById('deviationText');
    const analysisBody = document.getElementById('analysisBody');

    let audioCtx, analyser, globalStream, animationFrameId;
    let isListening = false;

    // Byzantine 72 Moria System Constants
    // Tone I Diatonic steps starting from ΠΑ: ΠΑ(0), ΒΟΥ(10), ΓΑ(18), ΔΙ(30), ΚΕ(42), ΖΩ(52), ΝΗ(60), ΠΑ'(72)
    const diatonicScale = [
        { name: "ΠΑ (Base)", step: 0 },
        { name: "ΒΟΥ", step: 10 },
        { name: "ΓΑ", step: 8 },
        { name: "ΔΙ", step: 12 },
        { name: "ΚΕ", step: 12 },
        { name: "ΖΩ", step: 10 },
        { name: "ΝΗ", step: 8 },
        { name: "ΠΑ'", step: 12 }
    ];

    function calculateTargetFrequencies() {
        const baseFreq = parseFloat(basePitchSelect.value);
        analysisBody.innerHTML = "";
        
        let cumulativeMoria = 0;
        diatonicScale.forEach((note, index) => {
            cumulativeMoria += note.step;
            
            // Frequency calculation based on log-interval system of 72 Moria per octave
            // Freq = Base * 2^(Moria / 72)
            const targetFreq = baseFreq * Math.pow(2, cumulativeMoria / 72);
            note.targetFreq = targetFreq;
            note.cumulativeMoria = cumulativeMoria;

            const row = document.createElement('tr');
            row.id = `note-row-${index}`;
            row.innerHTML = `
                <td><strong>${note.name}</strong></td>
                <td>${note.step === 0 ? '-' : note.step}</td>
                <td>${cumulativeMoria}</td>
                <td>${targetFreq.toFixed(1)} Hz</td>
                <td class="accuracy-cell" id="accuracy-${index}">-</td>
            `;
            analysisBody.appendChild(row);
        });
    }

    // Initialize layout tables
    calculateTargetFrequencies();
    basePitchSelect.addEventListener('change', calculateTargetFrequencies);

    recordBtn.addEventListener('click', async () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        if (!isListening) {
            try {
                globalStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(globalStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);

                isListening = true;
                recordBtn.innerText = "🛑 Stop Tracking";
                recordBtn.classList.add('recording');
                
                trackPitch();
            } catch (err) {
                alert("Microphone error: " + err.message);
            }
        } else {
            isListening = false;
            recordBtn.innerText = "🎤 Start Listening & Analyzing";
            recordBtn.classList.remove('recording');
            cancelAnimationFrame(animationFrameId);
            if (globalStream) globalStream.getTracks().forEach(track => track.stop());
        }
    });

    function trackPitch() {
        if (!isListening) return;
        animationFrameId = requestAnimationFrame(trackPitch);

        const bufferLength = analyser.fftSize;
        const buffer = new Float32Array(bufferLength);
        analyser.getFloatTimeDomainData(buffer);

        // Core Pitch Detection: Autocorrelation algorithm (YIN/AMDF light fallback)
        const sampleRate = audioCtx.sampleRate;
        const r = autoCorrelate(buffer, sampleRate);

        if (r !== -1 && r > 60 && r < 1000) { // Limit vocal registers
            liveFreq.innerText = `${r.toFixed(1)} Hz`;
            evaluateByzantinePitch(r);
        }
    }

    function autoCorrelate(buffer, sampleRate) {
        let SIZE = buffer.length;
        let maxSamples = Math.floor(SIZE / 2);
        let bestOffset = -1;
        let bestCorrelation = 0;
        let rms = 0;

        for (let i = 0; i < SIZE; i++) {
            let val = buffer[i];
            rms += val * val;
        }
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1; // Audio too quiet

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < maxSamples; i++) {
            if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
        }
        for (let i = SIZE - 1; i >= maxSamples; i--) {
            if (Math.abs(buffer[i]) < thres) { r2 = i; break; }
        }
        buffer = buffer.slice(r1, r2);
        SIZE = buffer.length;

        let correlations = new Float32Array(maxSamples);
        for (let offset = 0; offset < maxSamples; offset++) {
            let correlation = 0;
            for (let i = 0; i < maxSamples; i++) {
                correlation += Math.abs((buffer[i]) - (buffer[i + offset]));
            }
            correlations[offset] = correlation;
        }
        
        let minVal = 1000, minOffset = -1;
        for (let i = 1; i < maxSamples; i++) {
            if (correlations[i] < minVal) {
                minVal = correlations[i];
                minOffset = i;
            }
        }

        if (minOffset !== -1) {
            return sampleRate / minOffset;
        }
        return -1;
    }

    function evaluateByzantinePitch(currentFreq) {
        const baseFreq = parseFloat(basePitchSelect.value);
        
        // Find current total Moria distance from base
        // Moria = 72 * log2(CurrentFreq / BaseFreq)
        const currentMoria = 72 * Math.log2(currentFreq / baseFreq);

        // Map to closest note structure
        let closestNoteIndex = 0;
        let minDiff = 999;

        diatonicScale.forEach((note, index) => {
            let diff = Math.abs(currentMoria - note.cumulativeMoria);
            if (diff < minDiff) {
                minDiff = diff;
                closestNoteIndex = index;
            }
        });

        const targetNote = diatonicScale[closestNoteIndex];
        const moriaDeviation = currentMoria - targetNote.cumulativeMoria;

        // UI Feedback updates
        liveNote.innerText = targetNote.name;
        
        // Dynamic Pointer positioning (-3 to +3 Moria deviation spectrum mapping)
        let percent = 50 + (moriaDeviation * 16.6); // Scale to visual bounds
        percent = Math.max(5, Math.min(95, percent));
        deviationPointer.style.left = `${percent}%`;

        const cell = document.getElementById(`accuracy-${closestNoteIndex}`);
        
        // Critical Thresholds for Microtones
        // 1 Moria unit is approximately 16.6 cents. 
        if (Math.abs(moriaDeviation) < 0.4) {
            deviationText.innerText = "Perfect Intonation!";
            cell.innerText = "Accurate";
            cell.className = "accuracy-cell status-perfect";
        } else if (moriaDeviation >= 0.4) {
            deviationText.innerText = `Sharp (+${moriaDeviation.toFixed(1)} Moria)`;
            cell.innerText = "Sharp";
            cell.className = "accuracy-cell status-sharp";
        } else {
            deviationText.innerText = `Flat (${moriaDeviation.toFixed(1)} Moria)`;
            cell.innerText = "Flat";
            cell.className = "accuracy-cell status-flat";
        }
    }
</script>
</body>
</html>
