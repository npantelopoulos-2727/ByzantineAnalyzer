<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byzantine Live Interval Tuner</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fcfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #8a6d3b; margin-top: 0; text-align: center; }
        .setup-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        label { font-weight: bold; font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
        select, button { width: 100%; padding: 12px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; }
        button { border: none; cursor: pointer; font-weight: bold; color: white; }
        #recordBtn { background-color: #a94442; font-size: 16px; }
        #recordBtn.recording { background-color: #2e6da4; }
        
        .tuner-display {
            background: #111; color: #fff; padding: 25px; border-radius: 8px; text-align: center; margin: 20px 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #noteLabel { font-size: 48px; font-weight: bold; color: #ffcc00; margin: 0; }
        #freqLabel { font-size: 16px; color: #888; margin: 5px 0 15px 0; }
        
        /* Needle Meter styling */
        .meter-container { position: relative; height: 20px; background: #333; border-radius: 10px; margin-top: 10px; overflow: hidden;}
        .center-marker { position: absolute; left: 50%; width: 4px; height: 100%; background: #3c763d; transform: translateX(-50%); z-index: 2; }
        .needle { position: absolute; left: 50%; top: 0; width: 6px; height: 100%; background: #ff3333; transform: translateX(-50%); transition: left 0.05s ease-out; z-index: 3; }

        .analysis-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .analysis-table th, .analysis-table td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        .analysis-table th { background-color: #f5f0e6; color: #8a6d3b; }
        
        .active-row { background-color: #fff9e6; border: 2px solid #ffcc00 !important; }
        .status-perfect { color: #3c763d; font-weight: bold; }
        .status-sharp { color: #a94442; font-weight: bold; }
        .status-flat { color: #31708f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Byzantine Live Interval Tuner</h2>
    
    <div class="setup-row">
        <div class="form-group">
            <label>Scale (Tone I Diatonic)</label>
            <select id="scaleSelect">
                <option>10 - 8 - 12 - 12 - 10 - 8 - 12</option>
            </select>
        </div>
        <div class="form-group">
            <label>Base Pitch (Reference ΠΑ)</label>
            <select id="basePitch">
                <option value="220">ΠΑ @ 220 Hz (Male Standard)</option>
                <option value="110">ΠΑ @ 110 Hz (Deep Bass)</option>
                <option value="440">ΠΑ @ 440 Hz (Female Standard)</option>
            </select>
        </div>
    </div>

    <button id="recordBtn">🎤 Start Live Tracking</button>

    <div class="tuner-display">
        <div id="noteLabel">--</div>
        <div id="freqLabel">0.0 Hz</div>
        <div id="deviationText" style="font-size:14px; font-style:italic; color:#aaa;">Click start and sing a tone...</div>
        <div class="meter-container">
            <div class="center-marker"></div>
            <div id="needle" class="needle"></div>
        </div>
    </div>

    <table class="analysis-table">
        <thead>
            <tr>
                <th>Byzantine Note</th>
                <th>Interval (Moria)</th>
                <th>Total Moria</th>
                <th>Target Freq</th>
                <th>Live Status</th>
            </tr>
        </thead>
        <tbody id="analysisBody"></tbody>
    </table>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const basePitchSelect = document.getElementById('basePitch');
    const analysisBody = document.getElementById('analysisBody');
    const noteLabel = document.getElementById('noteLabel');
    const freqLabel = document.getElementById('freqLabel');
    const deviationText = document.getElementById('deviationText');
    const needle = document.getElementById('needle');

    let audioCtx, analyser, stream, animationId;
    let isListening = false;

    const steps = [
        { name: "ΠΑ", moria: 0 },
        { name: "ΒΟΥ", moria: 10 },
        { name: "ΓΑ", moria: 18 },
        { name: "ΔΙ", moria: 30 },
        { name: "ΚΕ", moria: 42 },
        { name: "ΖΩ", moria: 52 },
        { name: "ΝΗ", moria: 60 },
        { name: "ΠΑ’", moria: 72 }
    ];

    function buildTable() {
        const base = parseFloat(basePitchSelect.value);
        analysisBody.innerHTML = "";
        steps.forEach((step, idx) => {
            const targetF = base * Math.pow(2, step.moria / 72);
            const row = document.createElement('tr');
            row.id = `row-${idx}`;
            row.innerHTML = `
                <td><strong>${step.name}</strong></td>
                <td>${idx === 0 ? '-' : steps[idx].moria - steps[idx-1].moria}</td>
                <td>${step.moria}</td>
                <td>${targetF.toFixed(1)} Hz</td>
                <td id="status-${idx}">-</td>
            `;
            analysisBody.appendChild(row);
        });
    }

    buildTable();
    basePitchSelect.addEventListener('change', buildTable);

    recordBtn.addEventListener('click', async () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (!isListening) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Crisp sampling window for steady checking
                source.connect(analyser);
                
                isListening = true;
                recordBtn.innerText = "🛑 Stop Listening";
                recordBtn.classList.add('recording');
                deviationText.innerText = "Sing and hold any interval note...";
                
                loop();
            } catch(e) {
                alert("Microphone connection failed.");
            }
        } else {
            isListening = false;
            recordBtn.innerText = "🎤 Start Live Tracking";
            recordBtn.classList.remove('recording');
            noteLabel.innerText = "--";
            freqLabel.innerText = "0.0 Hz";
            deviationText.innerText = "Analysis stopped.";
            needle.style.left = "50%";
            cancelAnimationFrame(animationId);
            if (stream) stream.getTracks().forEach(t => t.stop());
            clearActiveRows();
        }
    });

    function loop() {
        if (!isListening) return;
        animationId = requestAnimationFrame(loop);

        const buffer = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buffer);

        const freq = autoCorrelateSample(buffer, audioCtx.sampleRate);
        if (freq > 0) {
            processLivePitch(freq);
        }
    }

    // High-precision pitch detection algorithm
    function autoCorrelateSample(buffer, sampleRate) {
        let size = buffer.length;
        let rms = 0;
        for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
        rms = Math.sqrt(rms / size);
        if (rms < 0.02) return -1; // Ignore silence & soft breathing echoes

        let r1 = 0, r2 = size - 1;
        let thres = 0.2;
        for (let i = 0; i < size / 2; i++) { if (Math.abs(buffer[i]) < thres) { r1 = i; break; } }
        for (let i = size - 1; i >= size / 2; i--) { if (Math.abs(buffer[i]) < thres) { r2 = i; break; } }
        let slicedBuffer = buffer.slice(r1, r2);
        
        let maxPeriod = Math.floor(sampleRate / 70);   // Min vocal range boundary
        let minPeriod = Math.floor(sampleRate / 600);  // Max vocal range boundary
        
        let bestPeriod = -1;
        let bestCorrelation = -1;

        for (let period = minPeriod; period < maxPeriod; period++) {
            let correlation = 0;
            for (let i = 0; i < slicedBuffer.length - period; i++) {
                correlation += slicedBuffer[i] * slicedBuffer[i + period];
            }
            if (correlation > bestCorrelation) {
                bestCorrelation = correlation;
                bestPeriod = period;
            }
        }
        return bestPeriod !== -1 ? (sampleRate / bestPeriod) : -1;
    }

    function clearActiveRows() {
        steps.forEach((_, idx) => {
            document.getElementById(`row-${idx}`).className = "";
            document.getElementById(`status-${idx}`).innerText = "-";
            document.getElementById(`status-${idx}`).className = "";
        });
    }

    function processLivePitch(freq) {
        const base = parseFloat(basePitchSelect.value);
        // Turn the frequency into a live cumulative Moria position
        const liveMoria = 72 * Math.log2(freq / base);

        let closestIdx = -1;
        let minDiff = 999;

        // Snapping window: determine which structural note the student is aiming for
        steps.forEach((step, idx) => {
            let diff = Math.abs(liveMoria - step.moria);
            if (diff < minDiff && diff < 6) { // Snapping tolerance parameter
                minDiff = diff;
                closestIdx = idx;
            }
        });

        if (closestIdx !== -1) {
            clearActiveRows();
            
            const targetStep = steps[closestIdx];
            const deviation = liveMoria - targetStep.moria; // How far off from the microtonal target

            // Highlight the row the student is currently hitting
            document.getElementById(`row-${closestIdx}`).className = "active-row";
            const statusCell = document.getElementById(`status-${closestIdx}`);

            noteLabel.innerText = targetStep.name;
            freqLabel.innerText = `${freq.toFixed(1)} Hz`;

            // Needle pointer physics calculation (-3 to +3 Moria spectrum bounds)
            let needlePosition = 50 + (deviation * 16.6); 
            needlePosition = Math.max(5, Math.min(95, needlePosition));
            needle.style.left = `${needlePosition}%`;

            // Evaluate thresholds
            if (Math.abs(deviation) <= 0.4) {
                deviationText.innerText = "Perfect Intonation!";
                statusCell.innerText = "Accurate";
                statusCell.className = "status-perfect";
            } else if (deviation > 0.4) {
                deviationText.innerText = `Sharp (+${deviation.toFixed(1)} Moria)`;
                statusCell.innerText = "Sharp";
                statusCell.className = "status-sharp";
            } else {
                deviationText.innerText = `Flat (${deviation.toFixed(1)} Moria)`;
                statusCell.innerText = "Flat";
                statusCell.className = "status-flat";
            }
        }
    }
</script>
</body>
</html>
