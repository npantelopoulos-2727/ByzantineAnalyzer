<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byzantine Scale Run Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fcfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #8a6d3b; margin-top: 0; }
        .setup-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        label { font-weight: bold; font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
        select, button { width: 100%; padding: 12px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; }
        button { border: none; cursor: pointer; font-weight: bold; color: white; }
        #recordBtn { background-color: #a94442; font-size: 16px; }
        #recordBtn.recording { background-color: #2e6da4; }
        
        .live-status {
            background: #222; color: #fff; padding: 15px; border-radius: 6px; text-align: center; margin: 15px 0; font-size: 18px;
        }
        #currentDetected { color: #ffcc00; font-weight: bold; }

        .analysis-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .analysis-table th, .analysis-table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        .analysis-table th { background-color: #f5f0e6; color: #8a6d3b; }
        
        .status-perfect { background-color: #dff0d8; color: #3c763d; font-weight: bold; border-radius: 4px; }
        .status-sharp { background-color: #f2dede; color: #a94442; font-weight: bold; border-radius: 4px; }
        .status-flat { background-color: #d9edf7; color: #31708f; font-weight: bold; border-radius: 4px; }
        .untracked { color: #999; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Byzantine Scale Run Analyzer</h2>
    <p style="font-size:14px; color:#555; margin-bottom:20px;">
        <strong>Instructions:</strong> Select your base pitch, click the button, and sing the full scale from lower ΠΑ up to upper ΠΑ’. Click stop when finished to see your scorecard.
    </p>

    <div class="setup-row">
        <div class="form-group">
            <label>Scale System</label>
            <select id="scaleSelect">
                <option>Tone I (Diatonic: 10-8-12-12-10-8-12)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Base Pitch (ΠΑ Reference)</label>
            <select id="basePitch">
                <option value="220">ΠΑ @ 220 Hz (Male Standard)</option>
                <option value="110">ΠΑ @ 110 Hz (Deep Bass)</option>
                <option value="440">ΠΑ @ 440 Hz (Female Standard)</option>
            </select>
        </div>
    </div>

    <button id="recordBtn">🎤 Start Scale Run</button>

    <div class="live-status">
        Listening status: <span id="currentDetected">Idle</span>
    </div>

    <table class="analysis-table">
        <thead>
            <tr>
                <th>Note</th>
                <th>Target Moria</th>
                <th>Target Freq</th>
                <th>Your Run Performance</th>
            </tr>
        </thead>
        <tbody id="analysisBody"></tbody>
    </table>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const basePitchSelect = document.getElementById('basePitch');
    const analysisBody = document.getElementById('analysisBody');
    const currentDetected = document.getElementById('currentDetected');

    let audioCtx, analyser, stream, animationId;
    let isRunning = false;

    // Scale mapping structure (Moria cumulative counts)
    const steps = [
        { name: "ΠΑ", moria: 0 },
        { name: "ΒΟΥ", moria: 10 },
        { name: "ΓΑ", moria: 18 },
        { name: "ΔΙ", moria: 30 },
        { name: "ΚΕ", moria: 42 },
        { name: "ΖΩ", moria: 52 },
        { name: "ΝΗ", moria: 60 },
        { name: "ΠΑ’", moria: 72 }
    ];

    // Storage array to record the deviations across the scale execution run
    let scaleRunData = {};

    function initTable() {
        const base = parseFloat(basePitchSelect.value);
        analysisBody.innerHTML = "";
        steps.forEach((step, idx) => {
            const targetF = base * Math.pow(2, step.moria / 72);
            scaleRunData[idx] = []; // Clear old data arrays
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${step.name}</strong></td>
                <td>${step.moria}</td>
                <td>${targetF.toFixed(1)} Hz</td>
                <td id="score-${idx}" class="untracked">Not detected yet</td>
            `;
            analysisBody.appendChild(row);
        });
    }

    initTable();
    basePitchSelect.addEventListener('change', initTable);

    recordBtn.addEventListener('click', async () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (!isRunning) {
            initTable(); // Reset visual grid
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024; // Faster sampling windows for fluid reaction tracking
                source.connect(analyser);
                
                isRunning = true;
                recordBtn.innerText = "🛑 Stop & Calculate Scorecard";
                recordBtn.classList.add('recording');
                currentDetected.innerText = "Listening... Sing scale now";
                
                processRun();
            } catch(e) {
                alert("Microphone capture failed.");
            }
        } else {
            isRunning = false;
            recordBtn.innerText = "🎤 Start Scale Run";
            recordBtn.classList.remove('recording');
            currentDetected.innerText = "Calculated!";
            cancelAnimationFrame(animationId);
            if (stream) stream.getTracks().forEach(t => t.stop());
            
            finalizeScorecard();
        }
    });

    function processRun() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(processRun);

        const buffer = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buffer);

        const freq = detectFundamentalFast(buffer, audioCtx.sampleRate);
        if (freq > 0) {
            matchNoteToScaleData(freq);
        }
    }

    // High-speed auto-correlation logic for instant pitch tracking response
    function detectFundamentalFast(buffer, sampleRate) {
        let size = buffer.length;
        let sum = 0;
        for (let i = 0; i < size; i++) sum += buffer[i] * buffer[i];
        if (Math.sqrt(sum / size) < 0.015) return -1; // Volume gate filter

        let bestPeriod = -1;
        let bestCorrelation = -1;

        // Scan vocal frequency bounds (approx 70Hz - 600Hz)
        let minPeriod = Math.floor(sampleRate / 600);
        let maxPeriod = Math.floor(sampleRate / 70);

        for (let period = minPeriod; period < maxPeriod; period++) {
            let correlation = 0;
            for (let i = 0; i < size - period; i++) {
                correlation += buffer[i] * buffer[i + period];
            }
            if (correlation > bestCorrelation) {
                bestCorrelation = correlation;
                bestPeriod = period;
            }
        }
        return bestPeriod !== -1 ? (sampleRate / bestPeriod) : -1;
    }

    function matchNoteToScaleData(freq) {
        const base = parseFloat(basePitchSelect.value);
        const calculatedMoria = 72 * Math.log2(freq / base);

        let closestIdx = -1;
        let minDiff = 999;

        steps.forEach((step, idx) => {
            let diff = Math.abs(calculatedMoria - step.moria);
            if (diff < minDiff && diff < 5) { // 5 Moria snapping threshold boundary
                minDiff = diff;
                closestIdx = idx;
            }
        });

        if (closestIdx !== -1) {
            const deviation = calculatedMoria - steps[closestIdx].moria;
            scaleRunData[closestIdx].push(deviation);
            currentDetected.innerText = `Singing: ${steps[closestIdx].name} (${freq.toFixed(1)} Hz)`;
            
            // Mark cell visually as currently being recorded
            document.getElementById(`score-${closestIdx}`).innerText = "Recording pitch data...";
            document.getElementById(`score-${closestIdx}`).className = "";
        }
    }

    function finalizeScorecard() {
        steps.forEach((step, idx) => {
            const dataset = scaleRunData[idx];
            const cell = document.getElementById(`score-${idx}`);
            
            if (dataset.length === 0) {
                cell.innerText = "Skipped / Unregistered";
                cell.className = "untracked";
                return;
            }

            // Calculate median filter value to drop outlier notes caused by shifting vocal frames
            dataset.sort((a, b) => a - b);
            const avgDeviation = dataset[Math.floor(dataset.length / 2)];

            if (Math.abs(avgDeviation) <= 0.4) {
                cell.innerText = "Accurate ✔";
                cell.className = "status-perfect";
            } else if (avgDeviation > 0.4) {
                cell.innerText = `Sharp (+${avgDeviation.toFixed(1)} Moria)`;
                cell.className = "status-sharp";
            } else {
                cell.innerText = `Flat (${avgDeviation.toFixed(1)} Moria)`;
                cell.className = "status-flat";
            }
        });
    }
</script>
</body>
</html>
