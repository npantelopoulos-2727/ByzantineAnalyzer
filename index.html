<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Byzantine Analyzer Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f0f0; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; font-size: 16px; color: #333; font-weight: bold; }
    </style>
</head>
<body>

    <button id="testBtn">🎤 Request Microphone & Start Test</button>
    <div id="status">Status: Waiting for click...</div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.innerText = "Status: Requesting permission...";
            
            try {
                // Force an Audio Context instantiation on click
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                
                // Request stream
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                status.style.color = "green";
                status.innerText = "Success! Microphone connected. Audio Context State: " + ctx.state;
                
                // Stop the stream immediately just to clean up the test
                stream.getTracks().forEach(track => track.stop());
                
            } catch (err) {
                status.style.color = "red";
                status.innerText = "Error Name: " + err.name + " | Message: " + err.message;
                console.error(err);
            }
        });
    </script>
</body>
</html>
