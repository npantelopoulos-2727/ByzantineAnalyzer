<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byzantine Speech & Pitch Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fcfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #8a6d3b; margin-top: 0; text-align: center; }
        button { width: 100%; padding: 15px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white; background-color: #a94442; }
        button.recording { background-color: #2e6da4; }
        
        .status-box {
            display: flex;
            justify-content: space-between;
            background: #111;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
        }
        .status-panel { flex: 1; text-align: center; border-right: 1px solid #333; }
        .status-panel:last-child { border: none; }
        .val { font-size: 32px; font-weight: bold; color: #ffcc00; margin-top: 5px; }

        .analysis-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .analysis-table th, .analysis-table td { border: 1px solid #ddd; padding: 12px; text-align: center; font-size: 14px; }
        .analysis-table th { background-color: #f5f0e6; color: #8a6d3b; }
        
        .status-perfect { background-color: #dff0d8; color: #3c763d; font-weight: bold; }
        .status-sharp { background-color: #f2dede; color: #a94442; font-weight: bold; }
        .status-flat { background-color: #d9edf7; color: #31708f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Byzantine Voice & Pitch Analyzer</h2>
    <p style="font-size: 14px; color: #666; text-align: center; margin-bottom: 20px;">
        Enunciate the note name clearly as you sing it (e.g., sing and hold <strong>"ΠΑ"</strong>, then sing and hold <strong>"ΚΕ"</strong>).
    </p>

    <button id="startBtn">🎤 Start Voice Recognition & Tuning</button>

    <div class="status-box">
        <div class="status-panel">
            <div>Syllable Heard</div>
            <div id="speechVal" class="val">--</div>
        </div>
        <div class="status-panel">
            <div>Live Pitch</div>
            <div id="pitchVal" class="val">0.0 Hz</div>
        </div>
    </div>

    <table class="analysis-table">
        <thead>
            <tr>
                <th>Note Name</th>
                <th>Target Interval (Moria)</th>
                <th>Registered Pitch</th>
                <th>Interval Accuracy vs ΠΑ</th>
            </tr>
        </thead>
        <tbody id="analysisBody"></tbody>
    </table>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const speechVal = document.getElementById('speechVal');
    const pitchVal = document.getElementById('pitchVal');
    const analysisBody = document.getElementById('analysisBody');

    let audioCtx, analyser, stream, animationId, recognition;
    let isRunning = false;
    let currentLivePitch = 0;

    // Byzantine structure mappings
    const noteConfig = {
        "ΠΑ":  { idx: 0, targetMoria: 0,   aliases: ["πα", "pa", "par", "bar"] },
        "ΒΟΥ": { idx: 1, targetMoria: 10,  aliases: ["βου", "βού", "vou", "bou", "vu", "bu"] },
        "ΓΑ":  { idx: 2, targetMoria: 18,  aliases: ["γα", "γά", "ga", "gar"] },
        "ΔΙ":  { idx: 3, targetMoria: 30,  aliases: ["δι", "δί", "di", "the", "dee"] },
        "ΚΕ":  { idx: 4, targetMoria: 42,  aliases: ["κε", "κέ", "ke", "kay", "keh"] },
        "ΖΩ":  { idx: 5, targetMoria: 52,  aliases: ["ζω", "ζώ", "zo", "zoe"] },
        "ΝΗ":  { idx: 6, targetMoria: 60,  aliases: ["νη", "νή", "ni", "nee"] },
        "ΠΑ2": { idx: 7, targetMoria: 72,  aliases: ["πα υψηλό", "πα2", "pa2"] }
    };

    // Keep track of what frequencies the singer registers during the session
    let sessionPitches = { 0: null, 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null };

    function renderTable() {
        analysisBody.innerHTML = "";
        Object.keys(noteConfig).forEach(key => {
            const config = noteConfig[key];
            const displayName = key === "ΠΑ2" ? "ΠΑ’ (High)" : key;
            const row = document.createElement('tr');
            row.id = `row-${config.idx}`;
            row.innerHTML = `
                <td><strong>${displayName}</strong></td>
                <td>${config.targetMoria} Moria</td>
                <td id="pitch-${config.idx}">-</td>
                <td id="status-${config.idx}">Sing & Enunciate...</td>
            `;
            analysisBody.appendChild(row);
        });
    }
    renderTable();

    // Initialize Web Speech Engine
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        // Support both Greek and English speech parameters natively
        recognition.lang = 'el-GR'; 

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal || event.results[i][0].confidence > 0.3) {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            processSpeechInput(interimTranscript.toLowerCase());
        };
    }

    startBtn.addEventListener('click', async () => {
        if (!SpeechRecognition) {
            alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
            return;
        }
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        if (!isRunning) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);

                isRunning = true;
                startBtn.innerText = "🛑 Stop Session";
                startBtn.classList.add('recording');
                
                recognition.start();
                pitchLoop();
            } catch (e) {
                alert("Microphone configuration error.");
            }
        } else {
            isRunning = false;
            startBtn.innerText = "🎤 Start Voice Recognition & Tuning";
            startBtn.classList.remove('recording');
            recognition.stop();
            cancelAnimationFrame(animationId);
            if (stream) stream.getTracks().forEach(t => t.stop());
        }
    });

    function pitchLoop() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(pitchLoop);

        const buffer = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buffer);
        
        const freq = autoCorrelate(buffer, audioCtx.sampleRate);
        if (freq > 0 && freq < 700) {
            currentLivePitch = freq;
            pitchVal.innerText = `${freq.toFixed(1)} Hz`;
        }
    }

    function processSpeechInput(transcript) {
        Object.keys(noteConfig).forEach(noteKey => {
            const config = noteConfig[noteKey];
            
            // Check if any phonetic aliases match what the engine transcribed
            const matched = config.aliases.some(alias => transcript.includes(alias));
            
            if (matched && currentLivePitch > 0) {
                speechVal.innerText = noteKey === "ΠΑ2" ? "ΠΑ’" : noteKey;
                
                // Store the captured pitch for this named note
                sessionPitches[config.idx] = currentLivePitch;
                document.getElementById(`pitch-${config.idx}`).innerText = `${currentLivePitch.toFixed(1)} Hz`;

                calculateIntervalRelations();
            }
        });
    }

    function calculateIntervalRelations() {
        const paPitch = sessionPitches[0]; // Base reference point ΠΑ
        
        Object.keys(noteConfig).forEach(noteKey => {
            const config = noteConfig[noteKey];
            const currentNotePitch = sessionPitches[config.idx];
            const statusCell = document.getElementById(`status-${config.idx}`);

            if (config.idx === 0 && paPitch) {
                statusCell.innerText = "Base Reference Locked";
                statusCell.className = "status-perfect";
                return;
            }

            if (!paPitch) {
                statusCell.innerText = "Waiting for base ΠΑ pitch...";
                return;
            }

            if (currentNotePitch) {
                // Determine true structural ratio distance using: 72 * log2(Note / Base)
                const measuredMoriaInterval = 72 * Math.log2(currentNotePitch / paPitch);
                const targetMoriaInterval = config.targetMoria;
                const deviation = measuredMoriaInterval - targetMoriaInterval;

                if (Math.abs(deviation) <= 0.5) {
                    statusCell.innerText = `In Tune! (True Step: ${measuredMoriaInterval.toFixed(1)} Moria)`;
                    statusCell.className = "status-perfect";
                } else if (deviation > 0.5) {
                    statusCell.innerText = `Sharp (+${deviation.toFixed(1)} Moria)`;
                    statusCell.className = "status-sharp";
                } else {
                    statusCell.innerText = `Flat (${deviation.toFixed(1)} Moria)`;
                    statusCell.className = "status-flat";
                }
            }
        });
    }

    // High fidelity fundamental pitch locator algorithm
    function autoCorrelate(buffer, sampleRate) {
        let size = buffer.length;
        let sum = 0;
        for (let i = 0; i < size; i++) sum += buffer[i] * buffer[i];
        if (Math.sqrt(sum / size) < 0.02) return -1;

        let bestPeriod = -1, bestCorrelation = -1;
        let minPeriod = Math.floor(sampleRate / 500);
        let maxPeriod = Math.floor(sampleRate / 80);

        for (let period = minPeriod; period < maxPeriod; period++) {
            let correlation = 0;
            for (let i = 0; i < size - period; i++) {
                correlation += buffer[i] * buffer[i + period];
            }
            if (correlation > bestCorrelation) {
                bestCorrelation = correlation;
                bestPeriod = period;
            }
        }
        return bestPeriod !== -1 ? (sampleRate / bestPeriod) : -1;
    }
</script>
</body>
</html>
